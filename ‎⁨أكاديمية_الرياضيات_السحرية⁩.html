<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية الرياضيات السحرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        magic: {
                            navy: '#1A2942',
                            darknavy: '#0F172A',
                            gold: '#D4AF37',
                            lightgold: '#FDE047',
                            brown: '#5C4033',
                            lightbrown: '#8B5A2B',
                            cream: '#FFFDD0',
                        }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'glow': 'glow 1.5s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-2px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(4px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-6px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(6px, 0, 0)' }
                        },
                        popIn: {
                            '0%': { transform: 'scale(0.5)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        },
                        glow: {
                            'from': { boxShadow: '0 0 10px #D4AF37, 0 0 20px #D4AF37' },
                            'to': { boxShadow: '0 0 20px #FDE047, 0 0 30px #FDE047' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #2a1f1f;
            background-image: radial-gradient(#4a332a 2px, transparent 2px);
            background-size: 30px 30px;
            overflow-x: hidden;
            user-select: none; /* منع تحديد النصوص المزعج أثناء اللعب */
        }
        .wood-board {
            background: #5C4033;
            border: 8px solid #3e2a22;
            border-radius: 24px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 15px 25px rgba(0,0,0,0.5);
        }
        .chalk-text {
            color: #FFFDD0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .magic-btn {
            background: linear-gradient(145deg, #1A2942, #0F172A);
            border: 3px solid #D4AF37;
            box-shadow: 0 8px 0 #0a0f1c, 0 15px 20px rgba(0,0,0,0.4);
            transition: all 0.1s;
        }
        .magic-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #0a0f1c, 0 5px 10px rgba(0,0,0,0.4);
        }
        .star-empty { filter: grayscale(100%) opacity(50%); }
        .star-filled { filter: drop-shadow(0 0 10px #FDE047); animation: pop-in 0.5s; }
        
        /* تأثيرات الإجابة */
        .overlay-correct {
            background: rgba(34, 197, 94, 0.9);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 text-magic-cream">

    <div id="game-container" class="w-full max-w-4xl wood-board relative overflow-hidden flex flex-col min-h-[85vh] sm:min-h-[75vh]">
        
        <!-- شريط التقدم السريع (يظهر أثناء اللعب فقط) -->
        <div id="top-bar" class="hidden flex justify-between items-center p-4 bg-black/40 border-b-4 border-magic-gold">
            <div class="flex gap-2 text-3xl" id="stars-container">
                <span class="star-empty">⭐</span>
                <span class="star-empty">⭐</span>
                <span class="star-empty">⭐</span>
                <span class="star-empty">⭐</span>
            </div>
            <div class="text-2xl font-bold text-magic-lightgold bg-black/50 px-4 py-1 rounded-full border border-magic-gold">
                النقاط: <span id="score-display">٠</span> 🌟
            </div>
        </div>

        <!-- منطقة المحتوى الديناميكي -->
        <div id="content-area" class="flex-1 flex flex-col items-center justify-center p-4 relative z-10 w-full h-full">
            <!-- المحتوى يُحقن هنا -->
        </div>

        <!-- شاشة احتفال سريعة تظهر فوق المحتوى -->
        <div id="success-overlay" class="hidden absolute inset-0 overlay-correct z-50 flex flex-col items-center justify-center animate-pop-in">
            <div class="text-8xl mb-4">✨🎯✨</div>
            <h2 class="text-5xl font-black text-white drop-shadow-lg mb-2">كفو يا بطل!</h2>
            <p class="text-3xl text-green-100 font-bold">إجابة سحرية صحيحة</p>
        </div>

    </div>

    <script>
        // دالة الأرقام العربية
        function toAr(num) {
            return num.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
        }

        // مراحل سريعة: تلميح بسيط + سؤال مباشر
        const gameStages = [
            {
                title: "المرحلة ١: الأنماط السحرية",
                hint: "السر 💡: اجمع الأرقام الصغيرة، ثم أضف الأصفار!",
                question: "صوّب عصاك! ما ناتج:\n\n٥٠٠ + ٤٠٠ = ؟",
                options: ["٩", "٩٠", "٩٠٠"],
                correctAnswer: 2 // ٩٠٠
            },
            {
                title: "المرحلة ٢: التقدير السريع",
                hint: "السر 💡: قرّب الأعداد لتصبح سهلة، نحن لا نبحث عن الإجابة الدقيقة!",
                question: "قرّب ثم اجمع:\n\n٦١ + ٢٨ \n(تقريباً ٦٠ + ٣٠) = ؟",
                options: ["٨٠", "٩٠", "١٠٠"],
                correctAnswer: 1 // ٩٠
            },
            {
                title: "المرحلة ٣: برج الجمع",
                hint: "السر 💡: اجمع الآحاد مع الآحاد، والعشرات مع العشرات!",
                question: "اجمع الأرقام السحرية:\n\n٢٤٥ + ١٣٤ = ؟",
                options: ["٣٧٩", "٣٨٩", "٤٧٩"],
                correctAnswer: 0 // ٣٧٩
            },
            {
                title: "المرحلة ٤: تحدي الطرح",
                hint: "السر 💡: إذا كان الرقم اللي فوق أصغر، استلف من جارك!",
                question: "التحدي الأخير! اطرح:\n\n٦٨ - ٣٥ = ؟",
                options: ["٢٣", "٣٣", "٤٣"],
                correctAnswer: 1 // ٣٣
            }
        ];

        let currentStageIndex = -1;
        let score = 0;
        
        const contentArea = document.getElementById('content-area');
        const topBar = document.getElementById('top-bar');
        const scoreDisplay = document.getElementById('score-display');
        const starsContainer = document.getElementById('stars-container');
        const successOverlay = document.getElementById('success-overlay');

        function renderScreen() {
            contentArea.innerHTML = ''; 

            if (currentStageIndex === -1) {
                renderIntro();
            } else if (currentStageIndex >= gameStages.length) {
                renderEndScreen();
            } else {
                topBar.classList.remove('hidden');
                scoreDisplay.innerText = toAr(score);
                updateStars();
                renderQuestion(gameStages[currentStageIndex]);
            }
        }

        function renderIntro() {
            topBar.classList.add('hidden');
            contentArea.innerHTML = `
                <div class="text-center flex flex-col items-center justify-center animate-pop-in w-full h-full">
                    <div class="text-7xl mb-4 animate-bounce-slow">🏰</div>
                    <h1 class="text-5xl sm:text-6xl font-black text-magic-gold mb-6 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] leading-tight">
                        أكاديمية<br>الرياضيات السحرية
                    </h1>
                    <p class="text-2xl text-magic-cream mb-10 chalk-text font-bold">
                        تحديات سريعة.. نقاط كثيرة! هل أنت جاهز؟
                    </p>
                    <button onclick="startGame()" class="magic-btn text-magic-lightgold font-black text-4xl py-4 px-12 rounded-2xl animate-glow">
                        ابدأ اللعب 🎮
                    </button>
                </div>
            `;
        }

        function renderQuestion(stage) {
            let optionsHTML = '';
            stage.options.forEach((opt, index) => {
                optionsHTML += `
                    <button onclick="checkAnswer(${index}, ${stage.correctAnswer}, this)" 
                            class="magic-btn text-magic-cream font-black text-4xl py-4 px-8 rounded-2xl w-[45%] sm:w-[30%] m-2 hover:bg-magic-darknavy hover:text-magic-gold">
                        ${opt}
                    </button>
                `;
            });

            contentArea.innerHTML = `
                <div id="question-box" class="w-full flex flex-col items-center text-center animate-pop-in h-full justify-around">
                    
                    <!-- التلميح السريع (بشكل بارز ومختصر) -->
                    <div class="bg-magic-lightbrown/90 border-4 border-magic-gold px-6 py-3 rounded-2xl shadow-lg w-[90%] max-w-lg transform -rotate-1">
                        <p class="text-2xl sm:text-3xl font-bold text-white">${stage.hint}</p>
                    </div>

                    <!-- السؤال -->
                    <div class="my-6">
                        <h2 class="text-3xl text-magic-gold mb-2 font-bold opacity-80">${stage.title}</h2>
                        <div class="text-4xl sm:text-5xl text-white font-black whitespace-pre-line chalk-text leading-snug">
                            ${stage.question}
                        </div>
                    </div>

                    <!-- الأزرار -->
                    <div class="flex flex-wrap justify-center w-full max-w-2xl">
                        ${optionsHTML}
                    </div>

                    <!-- رسالة خطأ (مخفية) -->
                    <div id="error-msg" class="hidden mt-4 text-2xl font-bold text-red-400 bg-red-900/50 px-6 py-2 rounded-full border border-red-500">
                        ❌ حاول مرة تانية يا بطل!
                    </div>
                </div>
            `;
        }

        function checkAnswer(selectedIndex, correctIndex, btnElement) {
            const btns = document.querySelectorAll('.magic-btn');
            const errorMsg = document.getElementById('error-msg');
            const qBox = document.getElementById('question-box');

            if (selectedIndex === correctIndex) {
                // تعطيل الأزرار فوراً
                btns.forEach(b => b.disabled = true);
                
                // تحديث النقاط
                score += 100; // نقطة كبيرة تعطي حماس
                scoreDisplay.innerText = toAr(score);
                
                // إظهار شاشة الاحتفال السريعة
                successOverlay.classList.remove('hidden');
                
                // انتقال تلقائي للمرحلة التالية بعد ثانية ونصف (بدون زر "التالي")
                setTimeout(() => {
                    successOverlay.classList.add('hidden');
                    currentStageIndex++;
                    renderScreen();
                }, 1500);

            } else {
                // إجابة خاطئة
                qBox.classList.remove('animate-shake');
                void qBox.offsetWidth; // إعادة تشغيل الأنيميشن
                qBox.classList.add('animate-shake');

                // تأثير الزر الخاطئ
                btnElement.classList.add('bg-red-800', 'border-red-500', 'text-red-200');
                btnElement.classList.remove('text-magic-cream');
                
                // إظهار رسالة التشجيع
                errorMsg.classList.remove('hidden');
            }
        }

        function updateStars() {
            // تلوين النجوم بناءً على رقم المرحلة
            const stars = starsContainer.children;
            for(let i=0; i<stars.length; i++) {
                if(i < currentStageIndex) {
                    stars[i].className = 'star-filled';
                } else {
                    stars[i].className = 'star-empty';
                }
            }
        }

        function renderEndScreen() {
            topBar.classList.add('hidden');
            contentArea.innerHTML = `
                <div class="text-center flex flex-col items-center justify-center animate-pop-in w-full h-full">
                    <div class="text-8xl mb-6 animate-bounce-slow">🏆</div>
                    <h1 class="text-5xl sm:text-7xl font-black text-magic-gold mb-4 drop-shadow-lg">
                        أنت أسطورة!
                    </h1>
                    <p class="text-3xl text-white mb-8 font-bold">
                        لقد ختمت اللعبة وفتحت كل الأبواب السحرية!
                    </p>
                    <div class="bg-black/50 p-6 rounded-3xl border-4 border-magic-gold mb-10 w-[80%] max-w-sm">
                        <p class="text-2xl text-magic-cream mb-2">نقاطك النهائية</p>
                        <p class="text-6xl font-black text-green-400 drop-shadow-[0_0_15px_#4ade80]">${toAr(score)} 🌟</p>
                    </div>
                    <button onclick="resetGame()" class="magic-btn text-magic-cream font-black text-3xl py-3 px-10 rounded-2xl">
                        العب مرة تانية 🔄
                    </button>
                </div>
            `;
        }

        function startGame() {
            currentStageIndex = 0;
            score = 0;
            renderScreen();
        }

        function resetGame() {
            currentStageIndex = -1;
            renderScreen();
        }

        window.onload = () => {
            renderScreen();
        };
    </script>
</body>
</html>
